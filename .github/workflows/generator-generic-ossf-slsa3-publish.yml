# 1. Clonar el repositorio (si no lo tienes)
git clone https://github.com/dayanlarzabal/Ahorro-Escalera-ascendente.git
cd Ahorro-Escalera-ascendente

# 2. Crear capacitor.config.ts
cat > capacitor.config.ts << 'EOF'
import type { CapacitorConfig } from '@capacitor/cli';

const config: CapacitorConfig = {
  appId: 'com.ahorro.escalera.ascendente',
  appName: 'Escalera Ascendente',
  webDir: 'dist',
  server: {
    // Cuando tengas la app desplegada, descomenta y pon tu URL:
    // url: 'https://tu-app.vercel.app',
  },
  android: {
    allowMixedContent: true,
  },
};

export default config;
EOF

# 3. Instalar Capacitor
npm install @capacitor/core@^7.2.0 @capacitor/android@^7.2.0
npm install -D @capacitor/cli@^7.2.0

# 4. Añadir scripts útiles
npm pkg set scripts.cap:add="npx cap add android"
npm pkg set scripts.cap:sync="npx cap sync android"
npm pkg set scripts.cap:open="npx cap open android"
npm pkg set scripts.apk="npm run build && npx cap sync android && cd android && ./gradlew assembleDebug"

# 5. Actualizar el workflow de GitHub Actions
mkdir -p .github/workflows
cat > .github/workflows/main.yml << 'EOF'
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web project
        run: npm run build
        continue-on-error: true

      - name: Add Capacitor Android platform (si no existe)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Escalera-Ascendente-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
EOF

# 6. Subir los cambios a GitHub
git add capacitor.config.ts package.json package-lock.json .github/workflows/main.yml
git commit -m "feat: configurar Capacitor para generar APK Android"
git push origin main
